<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laden – Bestellungen</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .order {
      background: #222;
      border-left: 6px solid orange;
      padding: 15px;
      margin-bottom: 15px;
    }

    .order small {
      color: #aaa;
    }
  </style>
</head>
<body>

<h1>📦 Eingehende Bestellungen</h1>

<div id="orders"></div>

<script type="module">
import { db } from "./firebase.js";
import {
  collection,
  query,
  orderBy,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const ordersDiv = document.getElementById("orders");

const q = query(
  collection(db, "orders"),
  orderBy("createdAt", "desc")
);

onSnapshot(q, (snapshot) => {
  ordersDiv.innerHTML = "";

  snapshot.forEach(doc => {
    const data = doc.data();

    const div = document.createElement("div");
    div.className = "order";

    div.innerHTML = `
      <strong>${data.item}</strong><br>
      Preis: ${data.total} €<br>
      Status: ${data.status}<br>
      <small>${data.createdAt?.toDate().toLocaleString()}</small>
    `;

    ordersDiv.appendChild(div);
  });
});
</script>

</body>
</html>
